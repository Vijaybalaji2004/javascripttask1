<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Management Dashboard</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f6fb;
            color: #333;
        }

        .header {
            background: linear-gradient(135deg, #4f46e5, #7c3aed);
            color: white;
            text-align: center;
            padding: 30px;
        }

        .header h1 {
            margin-bottom: 8px;
        }

        .container {
            width: 90%;
            max-width: 1200px;
            margin: 30px auto;
        }

        .controls {
            display: flex;
            gap: 15px;
            margin-bottom: 25px;
            flex-wrap: wrap;
        }

        input,
        select {
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            outline: none;
            font-size: 15px;
        }

        #searchInput {
            flex: 1;
            min-width: 250px;
        }

        .controls button,
        .add-form button {
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            background: #4f46e5;
            color: white;
            cursor: pointer;
            font-size: 15px;
        }

        .controls button:hover {
            background: #3730a3;
        }

        .add-form {
            background: white;
            padding: 25px;
            border-radius: 15px;
            margin-bottom: 30px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
        }

        .add-form h2 {
            color: #4f46e5;
            margin-bottom: 20px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }

        .form-grid input,
        .form-grid select {
            width: 100%;
        }

        .add-form button {
            margin-top: 15px;
            background: #16a34a;
        }

        .add-form button:hover {
            background: #15803d;
        }

        .count {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 20px;
        }

        .employee-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
        }

        .employee-card {
            background: white;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
            transition: 0.3s;
        }

        .employee-card:hover {
            transform: translateY(-5px);
        }

        .employee-card img {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            display: block;
            margin: auto;
        }

        .employee-card h2 {
            text-align: center;
            color: #4f46e5;
            margin: 12px 0;
        }

        .employee-card p {
            margin: 8px 0;
            font-size: 14px;
        }

        .delete-btn {
            width: 100%;
            padding: 10px;
            margin-top: 12px;
            border: none;
            border-radius: 7px;
            background: #ef4444;
            color: white;
            cursor: pointer;
        }

        .delete-btn:hover {
            background: #dc2626;
        }

        .loading {
            text-align: center;
            padding: 30px;
            font-size: 20px;
        }

        @media (max-width: 600px) {
            .form-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <div class="header">
        <h1>Employee Management Dashboard</h1>
        <p>Manage Employees Easily</p>
    </div>

    <div class="container">

        <div class="controls">

            <input
                type="text"
                id="searchInput"
                placeholder="Search employee by name..."
            >

            <select id="genderFilter">
                <option value="all">All Gender</option>
                <option value="male">Male</option>
                <option value="female">Female</option>
            </select>

            <button onclick="loadEmployees()">
                Reload Employees
            </button>

        </div>


        <div class="add-form">

            <h2>Add New Employee</h2>

            <div class="form-grid">

                <input
                    type="text"
                    id="firstName"
                    placeholder="First Name *"
                    required
                >

                <input
                    type="text"
                    id="lastName"
                    placeholder="Last Name *"
                    required
                >

                <input
                    type="email"
                    id="email"
                    placeholder="Email *"
                    required
                >

                <input
                    type="tel"
                    id="phone"
                    placeholder="Phone Number *"
                    required
                >

                <select id="gender" required>
                    <option value="">Select Gender *</option>
                    <option value="male">Male</option>
                    <option value="female">Female</option>
                </select>

                <input
                    type="number"
                    id="age"
                    placeholder="Age *"
                    min="1"
                    max="100"
                    required
                >

            </div>

            <button onclick="addEmployee()">
                + Add Employee
            </button>

        </div>


   
        <div class="count" id="employeeCount">
            Employees: 0
        </div>


        <div
            id="employeeContainer"
            class="employee-container"
        >
            <div class="loading">
                Loading employees...
            </div>
        </div>

    </div>


    <script>

        let employees = [];


        async function loadEmployees() {

            const container =
                document.getElementById("employeeContainer");

            container.innerHTML =
                `<div class="loading">Loading employees...</div>`;

            try {

                const response =
                    await fetch("https://dummyjson.com/users");

                const data =
                    await response.json();

                employees = data.users;

                displayEmployees(employees);

            } catch (error) {

                console.log(error);

                container.innerHTML =
                    `<div class="loading">
                        Failed to load employees
                    </div>`;
            }
        }


        function displayEmployees(data) {

            const container =
                document.getElementById("employeeContainer");

            const count =
                document.getElementById("employeeCount");

            container.innerHTML = "";

            count.innerText =
                "Employees: " + data.length;


            if (data.length === 0) {

                container.innerHTML =
                    `<div class="loading">
                        No employees found
                    </div>`;

                return;
            }


            data.forEach(function(employee) {

                const card =
                    document.createElement("div");

                card.className = "employee-card";

                card.innerHTML = `

                    <img
                        src="${employee.image}"
                        alt="Employee"
                    >

                    <h2>
                        ${employee.firstName}
                        ${employee.lastName}
                    </h2>

                    <p>
                        <strong>Email:</strong>
                        ${employee.email}
                    </p>

                    <p>
                        <strong>Phone:</strong>
                        ${employee.phone}
                    </p>

                    <p>
                        <strong>Gender:</strong>
                        ${employee.gender}
                    </p>

                    <p>
                        <strong>Age:</strong>
                        ${employee.age}
                    </p>

                    <button
                        class="delete-btn"
                        onclick="deleteEmployee(${employee.id})"
                    >
                        Delete Employee
                    </button>

                `;

                container.appendChild(card);

            });
        }


      
        function filterEmployees() {

            const search =
                document
                .getElementById("searchInput")
                .value
                .toLowerCase();

            const gender =
                document
                .getElementById("genderFilter")
                .value;


            const filtered =
                employees.filter(function(employee) {

                    const fullName =
                        employee.firstName +
                        " " +
                        employee.lastName;

                    const nameMatch =
                        fullName
                        .toLowerCase()
                        .includes(search);

                    const genderMatch =
                        gender === "all" ||
                        employee.gender === gender;

                    return nameMatch && genderMatch;
                });


            displayEmployees(filtered);
        }


        document
            .getElementById("searchInput")
            .addEventListener(
                "input",
                filterEmployees
            );


       
        document
            .getElementById("genderFilter")
            .addEventListener(
                "change",
                filterEmployees
            );


     
        function addEmployee() {

            const firstName =
                document.getElementById("firstName").value.trim();

            const lastName =
                document.getElementById("lastName").value.trim();

            const email =
                document.getElementById("email").value.trim();

            const phone =
                document.getElementById("phone").value.trim();

            const gender =
                document.getElementById("gender").value;

            const age =
                document.getElementById("age").value;


            if (
                firstName === "" ||
                lastName === "" ||
                email === "" ||
                phone === "" ||
                gender === "" ||
                age === ""
            ) {

                alert("Please fill all required fields!");

                return;
            }


            const newEmployee = {

                id: Date.now(),

                firstName: firstName,

                lastName: lastName,

                email: email,

                phone: phone,

                gender: gender,

                age: Number(age),

                image:
                    "https://dummyjson.com/icon/" +
                    firstName +
                    "/128"
            };


            employees.push(newEmployee);


            displayEmployees(employees);


            document.getElementById("firstName").value = "";

            document.getElementById("lastName").value = "";

            document.getElementById("email").value = "";

            document.getElementById("phone").value = "";

            document.getElementById("gender").value = "";

            document.getElementById("age").value = "";

        }


        // DELETE EMPLOYEE
        function deleteEmployee(id) {

            employees =
                employees.filter(function(employee) {

                    return employee.id !== id;

                });


            displayEmployees(employees);
        }


        // LOAD API DATA WHEN PAGE OPENS
        loadEmployees();

    </script>

</body>
</html>

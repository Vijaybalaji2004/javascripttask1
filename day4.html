<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
        //Task-1
        for (let i = 1; i <= 10; i++) {
            console.log(i);
        }


        //Task 2 — Reverse Number
        for (let i = 10; i >= 1; i--) {
            console.log(i);
        }


        //Task 3 — Even Numbers
        for (let i = 1; i <= 20; i++) {
            if (i % 2 === 0) {
                console.log(i);
            }
        }


        //Task 4 — Odd Numbers
        for (let i = 1; i <= 20; i++) {
            if (i % 2 !== 0) {
                console.log(i);
            }
        }


        // Tas 5 — Multiplication Table
        let number = Number(prompt("Enter a number"));

        for (let i = 1; i <= 10; i++) {
            console.log(number + " x " + i + " = " + (number * i));
        }



        //Task 6 — Countdown
        let i = 10;

        while (i >= 1) {
            console.log(i);
            i--;
        }



        //Task 7 — Sum of Numbers
        let i = 1;
        let sum = 0;

        while (i <= 10) {
            sum = sum + i;
            i++;
        }

        console.log(sum);



        //Task 8 — Print Numbers
        let i = 1;

        do {
            console.log(i);
            i++;
        } while (i <= 5);



        //Task 9 — Do While Understanding
        let a = 10;

        do {
            console.log(a);
            a++;
        } while (a <= 5);



        //Task 10 — String Characters
        let name = "vijaybalaji";

        for (let character of name) {
            console.log(character);
        }


        //Task 11 — Array Values
        let fruits = ["apple", "orange", "banana", "mango", "grapes"];

        for (let fruit of fruits) {
            console.log(fruit);
        }



        //Task 12 — Student Names
        let students = ["Arun", "Priya", "Rahul", "Kavya", "Vijay"];

        for (let student of students) {
            console.log("Student: " + student);
        }


        //Task 13 — Employee Object
        let employee = {
            name: "balaji",
            age: 25,
            role: "Developer",
            city: "Banglore"
        };

        for (let key in employee) {
            console.log(key, employee[key]);
        }



        //Task 14 — Product Object
        let product = {
            productName: "Laptop",
            price: 50000,
            brand: "Dell",
            category: "Electronics",
            stock: 10
        };

        for (let key in product) {
            console.log(key, product[key]);
        }
        //Task 15 — Simple Function
        function welcome() {
            console.log("Welcome to JavaScript");
        }

        welcome();
        welcome();
        welcome();



        //Task 16 — Function With Parameter
        function greet(name) {
            console.log("Hello " + name);
        }

        greet("Naveen");
        greet("Arun");
        greet("Priya");



        //Task 17 — Multiple Parameters
        function student(name, age, department) {
            console.log("Name:", name);
            console.log("Age:", age);
            console.log("Department:", department);
        }

        student("Arun", 21, "CSE");
        student("Priya", 22, "ECE");
        student("Vijay", 23, "EEE");




        //Task 18 — Addition Function
        function add(a, b) {
            return a + b;
        }

        let result = add(10, 20);

        console.log(result);

        //Task 19 — Salary
        function salary(amount) {
            return amount;
        }

        let result = salary(50000);

        console.log(result);



        //Task 20 — Bonus Calculator
        function bonus(salary, bonusAmount) {
            return salary + bonusAmount;
        }

        let total = bonus(50000, 5000);

        console.log(total);




        //Task 21
        function employee(name, role = "Developer") {
            console.log("Name:", name);
            console.log("Role:", role);
        }

        employee("Arun");
        employee("Priya", "Designer");



        //Task 22 — Named Function
        function square(number) {
            return number * number;
        }

        console.log(square(2));
        console.log(square(3));
        console.log(square(4));
        console.log(square(5));
        console.log(square(6));




        //Task 23 — Anonymous Function
        let calculate = function (a, b) {
            return a + b;
        };

        console.log(calculate(10, 20));



        //Task 24 — Arrow Function
        let multiply = (a, b) => {
            return a * b;
        };

        console.log(multiply(10, 5));



        //Task 25 — Predict the Output
        function test() {

            if (true) {

                var a = 10;
                let b = 20;
                const c = 30;

                console.log(a);
                console.log(b);
                console.log(c);
            }

            console.log(a);
            console.log(b);
            console.log(c);
        }

        test();

            //Task 29 — Self Invoking Function

            //IIFE 1
            (function () {
                console.log("Welcome to JavaScript");
            })();

        //IIFE 2

        (function (product, discount) {
            console.log(product + " has " + discount + "% discount");
        })("Laptop", 20);

        //output-Laptop has 20% discount




        //Task 30

        function welcome() {
            console.log("Welcome");
        }

        function execute(callback) {
            callback();
        }

        execute(welcome);




        //Task 31 — Cashback

        function* cashback() {
            yield "10% cashback";
            yield "20% cashback";
            yield "30% cashback";
            yield "Better luck next time";
        }

        let result = cashback();

        for (let value of result) {
            console.log(value);
        }



        //Task-32


        let employees = [
            {
                name: "Arun",
                age: 25,
                department: "IT",
                role: "Developer",
                salary: 40000
            },
            {
                name: "Priya",
                age: 24,
                department: "HR",
                role: "HR Executive",
                salary: 35000
            },
            {
                name: "Rahul",
                age: 27,
                department: "Finance",
                role: "Accountant",
                salary: 45000
            }
        ];


       //1.

        console.log("Employee Details");

        for (let employee of employees) {
            console.log(employee);
        }


       //2.

        console.log("Keys and Values");

        for (let employee of employees) {

            for (let key in employee) {
                console.log(key, employee[key]);
            }

            console.log("----------------");
        }


        // 3.

        function displayEmployee(employee) {
            console.log("Name:", employee.name);
            console.log("Age:", employee.age);
            console.log("Department:", employee.department);
            console.log("Role:", employee.role);
            console.log("Salary:", employee.salary);
        }


        // 4. 

        console.log("Employee Information");

        for (let employee of employees) {
            displayEmployee(employee);
            console.log("----------------");
        }


        // 5. 
        function getSalary(employee) {
            return employee.salary;
        }


        let employeeSalary = getSalary(employees[0]);

        console.log("Salary:", employeeSalary);


        // 6.

        console.log("Salary Check");

        for (let employee of employees) {

            if (employee.salary >= 40000) {
                console.log(employee.name + " has salary 40000 or above");
            } else {
                console.log(employee.name + " has salary below 40000");
            }
        }


        // 7. 

        let annualSalary = (salary) => {
            return salary * 12;
        };

        console.log("Annual Salary:", annualSalary(40000));


        // 8.

        function* benefits() {
            yield "Medical Insurance";
            yield "Transport";
            yield "Food Allowance";
            yield "Bonus";
        }


        let employeeBenefits = benefits();

        console.log("Employee Benefits");

        for (let benefit of employeeBenefits) {
            console.log(benefit);
        }

    </script>
</body>
